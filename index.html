<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadly Delivery – Item Value Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topLeft">
        <button id="navToggle" class="hamburger" type="button" aria-label="Menu" aria-expanded="false">☰</button>
        <h1 class="logo">Deadly Delivery – Item Value Calculator</h1>
      </div>

      <nav class="tabs" id="rightTabs">
        <button class="tab is-active" data-tab="browse">Browse</button>
        <button class="tab" data-tab="edit">Editor</button>
      </nav>
    </header>

    <div id="navOverlay" class="navOverlay" aria-hidden="true"></div>

    <main class="layout">
      <section class="panel left">
        <div class="panelHeader leftHeader">
          <div class="leftTabs">
            <button class="leftTab is-active" data-leftpage="food">Food</button>
            <button class="leftTab" data-leftpage="dish">Dish</button>
          </div>
        </div>

        <div id="leftFood" class="leftPage is-active">
          <div class="panelHeader">
            <input id="itemSearch" class="input" placeholder="Search." />
          </div>
          <div id="itemList" class="itemList"></div>
        </div>

        <div id="leftDish" class="leftPage">
          <div class="leftComingSoon">
            Coming soon. <br /><br />
            I'm not really sure how to go about this, I don't cook much. <br /><br />
            If you can help at all my discord is briicks, display is Bone.
          </div>
        </div>
      </section>

      <section class="panel right">
        <div id="viewBrowse" class="view is-active">
          <div class="panelHeader">
            <div class="rightHeaderLine">
              <div>
                <div id="selectedItemName" class="panelTitle">Select an item</div>
                <div id="selectedItemValue" class="muted"></div>
              </div>
            </div>
          </div>

          <div class="rightGrid">
            <div class="box">
              <div class="boxTitle">Affix Values</div>
              <div id="affixPriceTable" class="tableWrap"></div>
            </div>

            <div class="box">
              <div class="boxTitle">Combo Builder</div>
              <div id="affixChecklist" class="checklist"></div>

              <div class="comboSummary">
                <div class="line">
                  <span class="muted">Multiplier</span>
                  <span id="comboMultiplier" class="mono">—</span>
                </div>
                <div class="line">
                  <span class="muted">Value</span>
                  <span id="comboValue" class="mono big">—</span>
                </div>
              </div>
            </div>
          </div>

          <div class="box">
            <div class="boxTitle">All Combos</div>
            <div id="comboTable" class="tableWrap"></div>
          </div>
        </div>

        <div id="viewEdit" class="view">
          <div class="panelHeader">
            <div class="editorHeaderRow">
              <div class="panelTitle">Editor</div>
              <div class="row">
                <button id="btnResetDefaults" class="btn danger">Reset</button>
                <button id="btnExport" class="btn">Export</button>
                <button id="btnImport" class="btn">Import</button>
              </div>
            </div>
          </div>

          <div class="rightGrid">
            <div class="box">
              <div class="boxTitle">Items</div>
              <input id="newItemName" class="input" placeholder="Name" />
              <input id="newItemValue" class="input" placeholder="Base Value" inputmode="decimal" />
              <button id="btnAddItem" class="btn primary">Add Item</button>
              <div id="editorItems" class="editorList"></div>
            </div>

            <div class="box">
              <div class="boxTitle">Affixes</div>
              <input id="newAffixName" class="input" placeholder="Name" />
              <input id="newAffixMult" class="input" placeholder="Multiplier" inputmode="decimal" />
              <button id="btnAddAffix" class="btn primary">Add Affix</button>
              <div id="editorAffixes" class="editorList"></div>
            </div>
          </div>

          <input id="fileImport" type="file" accept="application/json" class="hidden" />
        </div>
      </section>
    </main>
  </div>

  <script src="data.defaults.js"></script>
  <script src="app.js"></script>

  <script>
  (() => {
    const btn = document.getElementById("navToggle");
    const overlay = document.getElementById("navOverlay");
    const root = document.documentElement;

    if (!btn || !overlay) return;

    const mq = window.matchMedia("(max-width: 700px)");
    const isMobile = () => mq.matches;

    const setOpen = (open) => {
      if (!isMobile()) open = false;
      root.classList.toggle("nav-open", open);
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      overlay.classList.toggle("is-active", open);
      overlay.setAttribute("aria-hidden", open ? "false" : "true");
    };

    btn.addEventListener("click", () => {
      setOpen(!root.classList.contains("nav-open"));
    });

    overlay.addEventListener("click", () => setOpen(false));

    document.addEventListener("click", (e) => {
      if (!root.classList.contains("nav-open")) return;
      const left = document.querySelector(".panel.left");
      if (!left || !left.contains(e.target)) return;

      if (e.target.closest(".itemRow") || e.target.closest(".leftTab")) {
        setOpen(false);
      }
    }, true);
    const onChange = () => setOpen(false);
    mq.addEventListener ? mq.addEventListener("change", onChange) : mq.addListener(onChange);
  })();
  </script>
</body>
</html>
